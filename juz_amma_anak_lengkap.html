<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juz Amma Anak</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9fbf8;color:#174f50;font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,#38bdb3,#7adbd3);padding:30px 18px 24px;text-align:center;color:#fff}
.cover{max-width:760px;margin:auto}
.kaaba{font-size:54px;margin-bottom:5px}
h1{margin:0;font-size:31px}
header p{margin:8px 0 0;font-size:15px}
main{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
h2{margin:0 0 15px}
.surat{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#f1fffd;color:#174f50;margin:8px 0;padding:13px 14px;border-radius:14px;text-align:left;font-size:16px;cursor:pointer}
.surat:hover{background:#dff8f4}
.no{width:34px;height:34px;border-radius:50%;background:#43c4ba;color:white;display:grid;place-items:center;flex:none}
#reader{display:none}
.back{border:0;background:#dcf5f2;color:#155b59;padding:9px 13px;border-radius:10px;cursor:pointer;margin-bottom:12px}
.meta{color:#6b8585;font-size:14px;margin-bottom:14px}
.ayah{padding:18px 0;border-bottom:1px solid #e1eeee}
.arabic{direction:rtl;text-align:right;font-size:29px;line-height:2.15;margin:5px 0 10px;color:#123f40}.latin{font-size:17px;line-height:1.8;font-style:italic;color:#3d6b6b;margin:0 0 10px}.homebtn{border:0;background:#43c4ba;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;margin:0 6px 14px 0}.audio{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.audio audio{width:100%;max-width:420px;height:42px}
.arti{font-size:16px;line-height:1.75;color:#456566}
.audio{border:0;background:#43c4ba;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;margin-top:10px}
.loading{text-align:center;padding:25px;color:#5e7b7b}
.error{background:#fff4f4;color:#9b4040;padding:14px;border-radius:12px;line-height:1.6}
.small{font-size:12px;color:#718686;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="cover">
    <div class="kaaba">🕋</div>
    <h1>JUZ AMMA ANAK</h1>
    <p>Belajar Membaca & Memahami Al-Qur'an</p>
  </div>
</header>

<main>
<section id="home" class="card">
  <h2>📖 37 Surat Juz Amma</h2>
  <div id="list"></div>
  <p class="small">Ayat, terjemah, dan audio dimuat dari data Al-Qur'an yang bersumber dari Mushaf Standar Indonesia/Kemenag melalui layanan data terverifikasi.</p>
</section>

<section id="reader" class="card">
  <button class="homebtn" onclick="goHome()">⌂ Halaman Utama</button><button class="back" onclick="goHome()">← Kembali</button>
  <h2 id="title"></h2>
  <div id="meta" class="meta"></div>
  <div id="ayahs"></div>
</section>
</main>

<script>
const names=[
"An-Naba'","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin",
"Al-Insyiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Gasyiyah","Al-Fajr",
"Al-Balad","Asy-Syams","Al-Lail","Ad-Duha","Asy-Syarh","At-Tin",
"Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah",
"At-Takatsur","Al-'Asr","Al-Humazah","Al-Fil","Quraisy","Al-Ma'un",
"Al-Kautsar","Al-Kafirun","An-Nasr","Al-Lahab","Al-Ikhlas","Al-Falaq","An-Nas"
];

const list=document.getElementById('list');
names.forEach((n,i)=>{
  const b=document.createElement('button');
  b.className='surat';
  b.innerHTML=`<span class="no">${i+1}</span><span><b>${n}</b><br><small>Surat ${i+1} • Juz Amma</small></span>`;
  b.onclick=()=>openSurat(i+78,n);
  list.appendChild(b);
});

async function getData(no){
  const r=await fetch(`https://equran.id/api/v2/surat/${no}`);
  if(!r.ok) throw new Error('Gagal mengambil data surat');
  const j=await r.json();
  if(!j || !j.data || !Array.isArray(j.data.ayat)) throw new Error('Format data tidak sesuai');
  return {
    ayat:j.data.ayat,
    nama:j.data.namaLatin||j.data.nama,
    jumlah:j.data.jumlahAyat
  };
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function openSurat(no,displayName){
  document.getElementById('home').style.display='none';
  document.getElementById('reader').style.display='block';
  document.getElementById('title').textContent=displayName;
  document.getElementById('meta').textContent='Memuat ayat lengkap...';
  document.getElementById('ayahs').innerHTML='<div class="loading">⏳ Menyiapkan ayat, arti, dan audio...</div>';
  try{
    const d=await getData(no);
    document.getElementById('meta').textContent=`${d.jumlah} ayat • Juz Amma`;
    document.getElementById('ayahs').innerHTML=d.ayat.map((a)=>{
      const arab=a.teksArab || a.text || '';
      const latin=a.teksLatin || a.teksLatin || a.latin || a.transliterasi || '';\n      const arti=a.teksIndonesia || a.text_translation || a.translation || '';
      const audio=typeof a.audio==='string' ? a.audio : (a.audio ? (a.audio['05'] || Object.values(a.audio)[0]) : '');
      return `<article class="ayah">
        <div class="arabic">${esc(arab)}</div>
        <div class="latin"><b>Latin:</b> ${esc(latin)}</div><div class="arti"><b>Artinya:</b> ${esc(arti)}</div>
        ${audio?`<div class="audio"><button class="audio" onclick="playAudio('${esc(audio)}')">▶ Putar Audio</button><audio controls preload="none" src="${esc(audio)}"></audio></div>`:''}
      </article>`;
    }).join('');
  }catch(e){
    document.getElementById('meta').textContent='';
    document.getElementById('ayahs').innerHTML='<div class="error"><b>Data belum tampil.</b><br>Pastikan internet aktif. Jika file dibuka langsung dari penyimpanan HP dan browser memblokir koneksi, versi ini perlu dipasang di hosting agar ayat, Latin, arti, dan audio tampil normal.</div>';
  }
}
let activeAudio=null; function playAudio(url){if(!url)return;if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;}activeAudio=new Audio(url);activeAudio.volume=1;activeAudio.play().catch(()=>alert('Audio belum bisa diputar. Gunakan pemutar audio yang tersedia di bawah ayat.'));}
function goHome(){
  document.getElementById('reader').style.display='none';
  document.getElementById('home').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
